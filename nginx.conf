# ─────────────────────────────────────────────────────────────────────────────
# nginx config for KBTU Sustainable Campus Dashboard
# Serves the React SPA on port 3010
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 3010;
    server_name _;

    root /usr/share/nginx/html/kbtu-dashboard;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf font/woff font/woff2;
    gzip_min_length 1024;

    # Cache static assets aggressively (hashed filenames by CRA)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint (no file needed — nginx responds directly)
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"kbtu-dashboard"}';
        add_header Content-Type application/json;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
    }

    # Access and error logs
    access_log /var/log/nginx/kbtu-dashboard-access.log;
    error_log  /var/log/nginx/kbtu-dashboard-error.log warn;
}
